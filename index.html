<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d17" />
    <title>Rhythm TD</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%23ff4d6d'/></svg>" />
  </head>
  <body>
    <div id="game"></div>

    <!-- Title, level select, pause and end screens are built by src/app/screens.ts -->
    <div id="screens"></div>

    <div id="coach" class="coach" hidden>
      <p class="coach-text"></p>
      <button type="button" class="coach-ok">Got it</button>
    </div>

    <div id="rewards" class="rewards" hidden>
      <p class="rewards-title">Wave cleared · pick one</p>
      <div class="rewards-cards"></div>
    </div>

    <div id="ingame" class="ingame" hidden>
      <button id="pause-button" type="button" class="chip" title="Pause (Esc)">Pause · Esc</button>
      <button id="tuning-toggle" type="button" class="chip" title="Tuning (T)">Tuning · T</button>
    </div>
    <aside id="tuning" hidden></aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
