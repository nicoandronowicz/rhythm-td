<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d17" />
    <title>Rhythm TD</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%23ff4d6d'/></svg>" />
  </head>
  <body>
    <div id="game"></div>

    <div id="start" class="overlay">
      <div class="start-card">
        <h1>Rhythm TD</h1>
        <p class="tagline">The defense is the track.</p>
        <button id="start-button" type="button">Click to start</button>
        <p class="hint">Sound on. Headphones or laptop speakers both work.</p>
      </div>
    </div>

    <div id="gameover" class="overlay" hidden>
      <div class="start-card">
        <h1>The beat stopped</h1>
        <p class="tagline" id="gameover-text"></p>
        <button id="restart-button" type="button">Play again</button>
      </div>
    </div>

    <button id="tuning-toggle" type="button" title="Tuning (T)">Tuning · T</button>
    <aside id="tuning" hidden></aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
